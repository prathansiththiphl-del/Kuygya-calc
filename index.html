<!DOCTYPE html>
<html>
<head>
  <title<OWERODs/title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="text-align:center; font-family:sans-serif;">

  <h1>🔥 Calculator Pro</h1>

  <input id="display" type="text" style="width:80%; height:50px; font-size:20px;" readonly><br><br>

  <div>
    <button onclick="add('7')">7</button>
    <button onclick="add('8')">8</button>
    <button onclick="add('9')">9</button>
    <button onclick="add('/')">÷</button><br>

    <button onclick="add('4')">4</button>
    <button onclick="add('5')">5</button>
    <button onclick="add('6')">6</button>
    <button onclick="add('*')">×</button><br>

    <button onclick="add('1')">1</button>
    <button onclick="add('2')">2</button>
    <button onclick="add('3')">3</button>
    <button onclick="add('-')">−</button><br>

    <button onclick="add('0')">0</button>
    <button onclick="add('.')">.</button>
    <button onclick="calculate()">=</button>
    <button onclick="add('+')">+</button><br>

    <button onclick="power()">x²</button>
    <button onclick="sqrt()">√</button>
    <button onclick="clearDisplay()">C</button>
  </div>

<script>
function add(val){
  document.getElementById("display").value += val;
}

function calculate(){
  try{
    let result = eval(document.getElementById("display").value);
    document.getElementById("display").value = result;
  }catch{
    alert("Error");
  }
}

function clearDisplay(){
  document.getElementById("display").value = "";
}

function power(){
  let val = document.getElementById("display").value;
  document.getElementById("display").value = val * val;
}

function sqrt(){
  let val = document.getElementById("display").value;
  document.getElementById("display").value = Math.sqrt(val);
}
</script>

</body>
</html>
