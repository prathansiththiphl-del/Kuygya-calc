
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบสำรวจนักเรียน</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f5fb;
  color:#202b45;
}
header{
  background:#263d80;
  color:white;
  padding:25px 18px;
  text-align:center;
}
header h2{margin:0 0 8px}
.container{
  max-width:520px;
  margin:30px auto;
  padding:0 15px;
}
.card{
  background:white;
  padding:24px;
  border-radius:16px;
  box-shadow:0 5px 25px #0001;
}
h3{margin-top:0}
label{
  display:block;
  margin-top:16px;
  font-weight:bold;
}
input,select{
  width:100%;
  padding:13px;
  margin-top:7px;
  border:1px solid #ccd2df;
  border-radius:9px;
  font-size:16px;
}
button{
  width:100%;
  padding:14px;
  margin-top:22px;
  background:#3155bd;
  color:white;
  border:0;
  border-radius:9px;
  font-size:17px;
  font-weight:bold;
}
button:active{opacity:.8}
.admin{
  text-align:center;
  margin:25px;
  color:#65718b;
}
.admin button{
  width:auto;
  padding:10px 20px;
  background:#64748b;
}
#message{
  margin-top:15px;
  text-align:center;
}
</style>
</head>
<body>

<header>
  <h2>ระบบสำรวจนักเรียน</h2>
  <div>แบบสำรวจความคิดเห็นนักเรียน</div>
</header>

<div class="container">
  <div class="card">
    <h3>กรอกข้อมูลนักเรียน</h3>

    <form id="surveyForm">

      <label>ชื่อจริง</label>
      <input name="name" required placeholder="กรอกชื่อจริง">

      <label>ชั้นเรียน</label>
      <select name="classroom" required>
        <option value="">เลือกชั้นเรียน</option>
        <option>ม.1</option>
        <option>ม.2</option>
        <option>ม.3</option>
        <option>ม.4</option>
        <option>ม.5</option>
        <option>ม.6</option>
      </select>

      <label>เลขที่</label>
      <input name="number" type="number" min="1" required placeholder="กรอกเลขที่">

      <label>วิชาที่ชอบ</label>
      <input name="favorite" required placeholder="ระบุวิชาที่ชอบ">

      <label>วิชาที่ไม่ชอบ</label>
      <input name="unfavorite" required placeholder="ระบุวิชาที่ไม่ชอบ">

      <label>เหตุผล</label>
      <input name="reason" required placeholder="ระบุเหตุผล">

      <button type="submit" id="submitBtn">ส่งแบบสำรวจ</button>
    </form>

    <div id="message"></div>
  </div>
</div>

<div class="admin">
  <button onclick="adminLogin()">เข้าสู่ระบบแอดมิน</button>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyAFauHeznqEulb0xlsWHOsmbPA8NGSPpuGOQenoZNyP5jyQiD--CNXh5gIynioL2AX/exec";

const form = document.getElementById("surveyForm");
const message = document.getElementById("message");

form.addEventListener("submit", function(e){
  e.preventDefault();

  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.textContent = "กำลังส่งข้อมูล...";

  const data = new FormData(form);
  data.append("action", "submit");

  const frame = document.createElement("iframe");
  frame.name = "submitFrame";
  frame.style.display = "none";
  document.body.appendChild(frame);

  const sendForm = document.createElement("form");
  sendForm.method = "POST";
  sendForm.action = API_URL;
  sendForm.target = "submitFrame";

  for (const [key,value] of data.entries()){
    const input = document.createElement("input");
    input.type = "hidden";
    input.name = key;
    input.value = value;
    sendForm.appendChild(input);
  }

  document.body.appendChild(sendForm);

  window.addEventListener("message", function handler(event){
    if(event.data && event.data.type === "survey_submit"){
      window.removeEventListener("message", handler);
      message.textContent = event.data.ok
        ? "ส่งแบบสำรวจสำเร็จแล้ว!"
        : "ส่งไม่สำเร็จ กรุณาลองใหม่";
      message.style.color = event.data.ok ? "green" : "red";
      if(event.data.ok) form.reset();
      btn.disabled = false;
      btn.textContent = "ส่งแบบสำรวจ";
      sendForm.remove();
      frame.remove();
    }
  });

  sendForm.submit();
});

function adminLogin(){
  alert("ระบบแอดมินกำลังเตรียมเชื่อมต่อ");
}
</script>

</body>
</html>
